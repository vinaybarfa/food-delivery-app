server:
  port: 1012
spring:
  application:
    name: food-services

  datasource:
    url: jdbc:postgresql://localhost:5432/food_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    open-in-view: false
axon:
  axonserver:
    servers: localhost:8124
    context: default

jwt:
  secretKey: ${JWT_SECRET_KEY}
  expiration: ${ACCESS_JWT_EXPIRATION}


logging:
  level:
    org:
      springframework:
        security: DEBUG
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    ip-address: localhost

restaurantService:
  base:
    url: http://localhost:1011

