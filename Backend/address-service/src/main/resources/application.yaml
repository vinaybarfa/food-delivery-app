spring:
  application:
    name: address-services
  datasource:
    url: jdbc:mysql://localhost:3306/address_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.hibernate.orm.jdbc.bind: trace

eureka:
